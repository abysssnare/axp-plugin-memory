name: CI

on:
  push:
  pull_request:

jobs:
  memory-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # AXP 规范仓库（公开）：校验器 / 参考运行时 / CLI 全部零依赖。
      # 获取方式：GitHub codeload tarball（HTTP，不经过 git 的 fetch/checkout 链）。
      # 备注：本仓库环境下 actions/checkout@v4 与裸 `git clone --depth 1` 取
      # abysssnare/axp 时都出现过深层文件缺失（axp/validator/src/validate.mjs
      # MODULE_NOT_FOUND），而 axp 仓库自身的 CI 与本地复刻均正常；改走 codeload
      # 后稳定，git 路径仅保留诊断（不阻塞）。
      - name: Fetch AXP repo via codeload tarball
        run: |
          set -eux
          curl -fsSL "https://codeload.github.com/abysssnare/axp/tar.gz/refs/heads/main" -o /tmp/axp.tgz
          mkdir -p axp-tmp && tar xzf /tmp/axp.tgz -C axp-tmp --strip-components=1
          mv axp-tmp axp
          echo "validator bytes: $(wc -c < axp/validator/src/validate.mjs)"
          echo "tracked files (git ls-files): $(git -C . ls-files 2>/dev/null | wc -l || echo n/a)"
          echo "axp tree files: $(find axp -type f | wc -l)"

      - name: Diagnose git-clone path (non-blocking)
        continue-on-error: true
        run: |
          set -x
          rm -rf /tmp/axp-git
          timeout 60 git clone --depth 1 https://github.com/abysssnare/axp.git /tmp/axp-git 2>&1 | tail -5
          echo "git clone file count: $(find /tmp/axp-git -type f -not -path '*/.git/*' | wc -l)"
          ls -la /tmp/axp-git/axp/validator/src/ 2>&1 | head -5

      - name: Validate plugin manifest
        run: node axp/validator/src/validate.mjs plugin

      - name: End-to-end demo (AXP-3 reference runtime, 27 assertions)
        run: node test/demo.mjs

      - name: Pack .axp distribution
        run: |
          mkdir -p dist
          node axp/cli/bin/axp.mjs pack plugin -o dist/memory.axp
          node axp/cli/bin/axp.mjs inspect plugin

      - name: Upload .axp artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-axp
          path: dist/memory.axp
          retention-days: 14
